<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shane Soper — Introduction</title><base href="../"><link rel="stylesheet" href="shared/site-nav.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}.component-frame{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body class="introduction-page"><iframe class="component-frame" src="introduction/welcome-locked.html" title="Shane Soper — Introduction" allow="autoplay; fullscreen"></iframe><script src="shared/journey-tracker.js"></script><script src="shared/site-nav.js"></script><script>(()=>{const frame=document.querySelector('.component-frame'),directAbout=new URLSearchParams(location.search).get('start')==='about';let loaded=false,startTimer=0;const startAbout=()=>{SSSSiteNav.close();clearTimeout(startTimer);startTimer=setTimeout(()=>frame.contentWindow.postMessage({type:'sss-welcome-v26-start-about'},'*'),2000)};addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const t=e.data&&e.data.type;if(t==='sss-welcome-v26-view-cv')SSSSiteNav.openLiveCvWarning();if(t==='sss-welcome-v26-navigation')SSSSiteNav.open()});addEventListener('sss-start-about',startAbout);frame.addEventListener('load',()=>{try{
  const doc=frame.contentDocument,track=window.SSSJourneyTrack;
  let current=null;
  const sync=()=>{const slide=doc.querySelector('.slide.active');if(slide===current)return;if(current)track?.end('introduction-slide');current=slide;if(slide){const i=[...doc.querySelectorAll('.slide')].indexOf(slide)+1;const label=(slide.querySelector('h1,h2,h3')?.textContent||'Slide '+i).replace(/\s+/g,' ').trim().slice(0,90);track?.begin('introduction-slide','Introduction','Slide '+i+' — '+label)}};
  const observer=new MutationObserver(sync);doc.querySelectorAll('.slide').forEach(slide=>observer.observe(slide,{attributes:true,attributeFilter:['class']}));sync();
  doc.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const label=(btn.getAttribute('aria-label')||btn.textContent||'').replace(/\s+/g,' ').trim();if(label)track?.event('introduction_action','Introduction',label)},true);
}catch(_){}});frame.addEventListener('load',()=>{if(loaded)return;loaded=true;if(directAbout)startAbout();else SSSSiteNav.open()})})();</script></body></html>

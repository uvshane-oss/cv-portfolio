<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shane Soper — Skills</title><base href="../"><link rel="stylesheet" href="shared/site-nav.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}.component-frame{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body class="skills-page"><iframe class="component-frame" src="skills/matrix-v034-locked.html" title="Shane Soper — Skills" allow="autoplay; fullscreen"></iframe><script src="shared/journey-tracker.js"></script><script src="shared/site-nav.js"></script><script>(()=>{const frame=document.querySelector('.component-frame');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,track=window.SSSJourneyTrack,seen=new Map();let nextId=0;
const labelOf=el=>{const strong=el.querySelector('.management-basic-copy > strong,.management-basics-choice strong,.pathchoice strong')||el.querySelector('strong');const number=el.querySelector('.management-basic-number');return ((number?number.textContent.trim()+'. ':'')+(el.getAttribute('aria-label')||strong?.textContent||el.textContent||'')).replace(/\s+/g,' ').trim().slice(0,120)};
const isExpanded=el=>el.isConnected&&(el.getAttribute('aria-expanded')==='true'||el.matches('details[open]'));
const reconcile=()=>{for(const [el,state] of seen){const open=isExpanded(el);if(open===state.open)continue;state.open=open;if(open)track?.begin(state.key,'Skills',state.label);else track?.end(state.key)}};
new MutationObserver(reconcile).observe(doc.body,{subtree:true,attributes:true,childList:true,attributeFilter:['aria-expanded','open']});
frame.contentDocument.addEventListener('click',e=>{const el=e.target.closest('button,a,summary,[role="button"]');if(!el)return;const headline=el.querySelector('.management-basic-copy > strong,.management-basics-choice strong,.pathchoice strong')||el.querySelector('strong');const number=el.querySelector('.management-basic-number');const raw=el.getAttribute('aria-label')||headline?.textContent||el.textContent||'';const label=((number?number.textContent.trim()+'. ':'')+raw).replace(/\s+/g,' ').trim().slice(0,120);if(!label)return;const route=el.closest('[data-route]')?.getAttribute('data-route')||'Skills';if(el.hasAttribute('aria-expanded')||el.matches('summary')){const toggle=el.matches('summary')?el.parentElement:el;if(!seen.has(toggle))seen.set(toggle,{key:'skills-panel-'+(++nextId),label,open:isExpanded(toggle)});setTimeout(reconcile,0)}const expanded=el.matches('summary')?(el.parentElement.open?'true':'false'):el.getAttribute('aria-expanded');const action=expanded==='false'?'skills_open':expanded==='true'?'skills_close':'skills_select';window.SSSJourneyTrack?.event(action,'Skills',label,route)},true)}catch(_){}})})();</script><script>(()=>{const p=new URLSearchParams(location.search);if(p.get('open')==='menu')addEventListener('load',()=>window.SSSSiteNav?.open(),{once:true})})();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shane Soper - Professional CV & Portfolio</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --border-color: #eaeaea;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        @media(min-width: 768px) {
            body { padding: 20px; }
            .container { padding: 40px; }
        }

        /* Header Styling */
        .cv-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .cv-header h1 {
            margin: 0 0 8px 0;
            color: #111;
            font-size: 26px;
        }
        @media(min-width: 768px) {
            .cv-header h1 { font-size: 32px; }
        }
        .cv-header p {
            margin: 4px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        @media(min-width: 768px) {
            .cv-header p { font-size: 15px; }
        }

        /* Section Heading */
        h2.section-title {
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
        }
        @media(min-width: 768px) {
            h2.section-title { font-size: 22px; }
        }

        /* Clickable Role Card */
        .role-card {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        @media(min-width: 768px) {
            .role-card { padding: 20px; margin-bottom: 16px; }
        }
        .role-card:hover {
            background: #f1f3f5;
            border-color: #cbd5e1;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        .role-meta {
            font-weight: bold;
            color: var(--accent);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        @media(min-width: 768px) {
            .role-meta { font-size: 13px; }
        }

        .main-role-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--primary);
            margin: 3px 0 6px 0;
        }
        @media(min-width: 768px) {
            .main-role-title { font-size: 20px; }
        }

        .role-summary {
            font-style: italic;
            color: var(--text-muted);
            margin: 0;
            font-size: 13px;
        }
        @media(min-width: 768px) {
            .role-summary { font-size: 15px; }
        }

        /* Collapsible Content */
        .collapsible-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed var(--border-color);
            cursor: default;
        }
        .collapsible-content.show { display: block; }

        /* Logo Image Styling */
        .role-logo {
            max-height: 45px;
            width: auto;
            object-fit: contain;
            margin-bottom: 12px;
            display: block;
        }

        ul { padding-left: 18px; margin: 8px 0; }
        li { margin-bottom: 6px; font-size: 13px; }
        @media(min-width: 768px) {
            li { font-size: 15px; }
        }

        /* Portfolio Media Gallery Grid */
        .portfolio-gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        @media(min-width: 600px) {
            .portfolio-gallery { grid-template-columns: 1fr 1fr; }
        }
        .portfolio-img-wrapper {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            padding: 8px;
            text-align: center;
        }
        .portfolio-img-wrapper img {
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        @media(min-width: 600px) {
            .video-grid { grid-template-columns: 1fr 1fr; }
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        /* Detailed Study Link Style */
        .detail-link-container {
            margin-top: 15px;
            text-align: right;
        }
        .detail-link {
            font-size: 13px;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        .detail-link:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="cv-header">
        <h1>Shane Soper</h1>
        <p>153 East Road, Ascot, Invercargill, Southland, New Zealand</
